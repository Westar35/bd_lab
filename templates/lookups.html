{{define "lookups.html"}}
{{template "header" .}}
<h1>Справочники</h1>
<p class="muted">Все справочные таблицы доступны для просмотра и редактирования.</p>

<div class="grid-cards">
    {{range .Items}}
        <a class="card-link" href="{{.Path}}">
            <h3>{{.Name}}</h3>
            <p>{{.Description}}</p>
        </a>
    {{end}}
</div>
{{template "footer" .}}
{{end}}
